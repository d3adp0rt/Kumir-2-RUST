[workspace]
members = ["crates/kumir-core", "crates/kumir-cli", "crates/kumir-gui"]
default-members = ["crates/kumir-core", "crates/kumir-cli", "crates/kumir-gui"]
resolver = "2"

[workspace.package]
version = "3.0.8"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
authors = ["Kumir Rust port contributors"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
kumir-core = { path = "crates/kumir-core" }

[patch.crates-io]
# Патч: на Android не перезапускать IME (hide+show) при interrupt_ime —
# иначе клавиатура мигает на каждом клике в редакторе.
egui-winit = { path = "vendor/egui-winit" }
